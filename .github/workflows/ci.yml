name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: Backend (fmt, clippy, test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: handover_rust
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: handover_rust
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # Uses a fake sandbox, so no Docker is needed.
      - run: cargo test --locked

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  desktop:
    name: Desktop shell (fmt, clippy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            handover_rust
            handover_app/src-tauri
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # tauri-build requires the sidecar binary to exist.
      - name: Build backend sidecar
        run: |
          (cd handover_rust && cargo build --locked)
          node handover_app/scripts/prepare-backend-sidecar.js debug
      - working-directory: handover_app/src-tauri
        run: cargo fmt --check
      - working-directory: handover_app/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
